name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run linter (if configured)
      working-directory: ./backend
      run: npm run lint --if-present

    - name: Run tests
      working-directory: ./backend
      run: npm test
      env:
        NODE_ENV: test
        MONGO: ${{ secrets.TEST_MONGO_URI }}
        CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        SAMBANOVA_API_URL: ${{ secrets.SAMBANOVA_API_URL }}
        SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        IMAGEKIT_ENDPOINT: ${{ secrets.IMAGEKIT_ENDPOINT }}
        IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
        IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      working-directory: ./client
      run: npm ci

    - name: Run linter
      working-directory: ./client
      run: npm run lint --if-present

    - name: Build frontend
      working-directory: ./client
      run: npm run build
      env:
        VITE_API_URL: http://localhost:3001
        VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        VITE_IMAGE_KIT_ENDPOINT: ${{ secrets.VITE_IMAGE_KIT_ENDPOINT }}
        VITE_IMAGE_KIT_PUBLIC_KEY: ${{ secrets.VITE_IMAGE_KIT_PUBLIC_KEY }}

    - name: Run tests
      working-directory: ./client
      run: npm test --if-present

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x

    - name: Backend security audit
      working-directory: ./backend
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Frontend security audit
      working-directory: ./client
      run: npm audit --audit-level=high
      continue-on-error: true

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x

    # Add additional code quality tools here
    # Examples: ESLint, Prettier, SonarQube, etc.

  deploy-preview:
    name: Deploy Preview (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [test-backend, test-frontend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Comment on PR
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ All tests passed! Ready for review.'
          })

  # Uncomment and configure when ready to deploy automatically
